name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run unit and integration tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gymbromatics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        shell: bash
        run: |
          docker run --detach --rm --name gymbromatics-ci \
            --publish 8080:8080 \
            --env GEMINI_API_KEY=ci-placeholder \
            --env GEMINI_FREE_TIER_CONFIRMED=true \
            gymbromatics:ci
          trap 'docker stop gymbromatics-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /tmp/ready.json; then
              break
            fi
            sleep 1
          done
          grep --fixed-strings '"status":"ready"' /tmp/ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/docs)" = 200
          test "$(docker image inspect gymbromatics:ci --format '{{.Config.User}}')" = gymbromatics
          ! docker image inspect gymbromatics:ci | grep --fixed-strings ci-placeholder
