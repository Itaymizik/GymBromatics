name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run unit and integration tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          push: false
          tags: gymbromatics:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: gymbromatics-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Smoke test container
        shell: bash
        run: |
          docker run --detach --rm --name gymbromatics-ci \
            --publish 8080:8080 \
            --env GEMINI_API_KEY=ci-placeholder \
            --env GEMINI_FREE_TIER_CONFIRMED=true \
            gymbromatics:ci
          docker run --detach --rm --name gymbromatics-worker-ci \
            gymbromatics-worker:ci
          trap 'docker stop gymbromatics-ci gymbromatics-worker-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /tmp/ready.json; then
              break
            fi
            sleep 1
          done
          grep --fixed-strings '"status":"ready"' /tmp/ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/docs)" = 200
          test "$(docker image inspect gymbromatics:ci --format '{{.Config.User}}')" = gymbromatics
          test "$(docker image inspect gymbromatics-worker:ci --format '{{.Config.User}}')" = gymbromatics
          for attempt in {1..30}; do
            if [ "$(docker inspect gymbromatics-worker-ci --format '{{.State.Health.Status}}')" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect gymbromatics-worker-ci --format '{{.State.Health.Status}}')" = healthy
          ! docker image inspect gymbromatics:ci | grep --fixed-strings ci-placeholder

  compose-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run real upload and MediaPipe processing flow
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps || true
              docker compose logs --no-color || true
            fi
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          docker compose up --detach --build --wait --wait-timeout 180
          python scripts/compose_e2e.py tests/fixtures/squat_e2e.mp4 \
            --timeout-seconds 300
