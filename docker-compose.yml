name: gymbromatics

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - gymbromatics-runtime:/app/.gymbromatics-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: gymbromatics
      POSTGRES_USER: gymbromatics
      POSTGRES_PASSWORD: gymbromatics-local
    volumes:
      - gymbromatics-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbromatics -d gymbromatics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *runtime
    build:
      context: .
      target: api
    image: gymbromatics-api:local
    ports:
      - "8765:8080"
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://gymbromatics:gymbromatics-local@postgres:5432/gymbromatics
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *runtime
    build:
      context: .
      target: worker
    image: gymbromatics-worker:local
    env_file:
      - path: .env.local
        required: false
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      DATABASE_URL: postgresql://gymbromatics:gymbromatics-local@postgres:5432/gymbromatics
    command:
      - python
      - -m
      - gymbromatics.worker
      - --watch
      - --poll-seconds
      - "1"
      - --timeout-seconds
      - "600"
      - --max-attempts
      - "3"
      - --backoff-seconds
      - "5"
    depends_on:
      api:
        condition: service_healthy

volumes:
  gymbromatics-runtime:
  gymbromatics-postgres:
